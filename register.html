<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17365d">
  <title>Koon15 Parking — ลงทะเบียนลูกค้า</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 24px 16px; font-family: Arial, sans-serif;
      background: #f3f6fb; color: #243247;
    }
    main {
      width: min(100%, 560px); background: #fff; border-radius: 16px;
      overflow: hidden; box-shadow: 0 12px 36px #17365d18;
    }
    header { background: #17365d; color: #fff; padding: 28px 24px; }
    h1 { margin: 0 0 8px; font-size: 25px; }
    header p { margin: 0; line-height: 1.6; opacity: .9; }
    section { padding: 24px; line-height: 1.7; }
    .notice {
      background: #fff8e6; color: #805b00; border-radius: 10px;
      padding: 14px; margin: 0 0 20px; font-size: 14px;
    }
    a.button {
      display: block; text-align: center; background: #17365d; color: #fff;
      text-decoration: none; font-weight: bold; border-radius: 9px;
      padding: 14px 18px; margin-top: 18px;
    }
    a.button:focus-visible { outline: 3px solid #77a7ff; outline-offset: 3px; }
    .small { color: #64748b; font-size: 13px; margin-top: 18px; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Koon15 Parking</h1>
      <p>ระบบลงทะเบียนลูกค้าใหม่</p>
    </header>
    <section>
      <div class="notice">
        เพื่อป้องกันข้อมูลสูญหาย แบบฟอร์มนี้จะไม่แสดงว่าบันทึกสำเร็จจนกว่าระบบหลังบ้านจะยืนยัน
      </div>
      <p>กรุณาเปิดแบบฟอร์มลงทะเบียนที่เชื่อมกับ Google Apps Script Backend ของ Koon15 Parking</p>
      <a class="button" href="https://script.google.com/macros/s/AKfycbxLwC2EWfKe0y2lxshkNeJ7xwDzioTVRfjLfWbetpTaZKB2QRj09UDXfrv4Ub-F4yZ-Bw/exec?page=register">
        เปิดแบบฟอร์มลงทะเบียน
      </a>
      <p class="small">หากเปิดแบบฟอร์มไม่ได้ โปรดติดต่อผู้ดูแลระบบก่อนกรอกข้อมูลซ้ำ</p>
    </section>
  </main>
</body>
</html>
