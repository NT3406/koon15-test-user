<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Koon15 Test User</title>
</head>

<body>

  <h2>Koon15 Test User</h2>

  <p id="status">กำลังเริ่มต้น...</p>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <script>

    const LIFF_ID = '2011211599-Yc8XcQ9U';

    const GAS_URL =
      'https://script.google.com/macros/s/AKfycbxLwC2EWfKe0y2lxshkNeJ7xwDzioTVRfjLfWbetpTaZKB2QRj09UDXfrv4Ub-F4yZ-Bw/exec';


    async function main() {

      const status = document.getElementById('status');

      try {

        status.innerText =
          '1. กำลังเริ่ม LIFF...';

        await liff.init({
          liffId: LIFF_ID
        });


        if (!liff.isInClient() && !liff.isLoggedIn()) {

          status.innerText =
            '2. กำลังเข้าสู่ระบบ LINE...';

          liff.login();

          return;
        }


        status.innerText =
          '3. กำลังสร้าง ID Token...';

        const idToken = liff.getIDToken();

        if (!idToken) {
          throw new Error(
            'ไม่พบ ID Token'
          );
        }


        status.innerText =
          '4. กำลังส่งข้อมูลไป Google Sheet...';


        const response = await fetch(
          GAS_URL,
          {
            method: 'POST',

            headers: {
              'Content-Type': 'text/plain;charset=utf-8'
            },

            body: JSON.stringify({
              idToken: idToken
            })
          }
        );


        const result =
          await response.json();


        if (!result.success) {

          throw new Error(
            result.error || 'Google Sheet ไม่ตอบกลับสำเร็จ'
          );

        }


        status.innerHTML =
          '<h3>✅ สำเร็จ</h3>' +
          '<p>บันทึก LINE User ID แล้ว</p>' +
          '<p>ชื่อ LINE:</p>' +
          '<strong>' +
          result.displayName +
          '</strong>';


      } catch (error) {

        status.innerHTML =
          '<h3>❌ เกิดข้อผิดพลาด</h3>' +
          '<p>' +
          error.message +
          '</p>';

      }

    }


    main();

  </script>

</body>
</html>
